<body>

<header>
    <h1>Digital Signage Admin Panel</h1>
    <p>Manage devices and media</p>
</header>

<div class="container">

```
<div class="grid">

    <!-- DEVICE REGISTER -->
    <div class="card">
        <h2>Register Device</h2>

        <input
            type="text"
            id="deviceId"
            placeholder="Device ID e.g. YF-0001"
        >

        <button onclick="registerDevice()">
            Register Device
        </button>
    </div>

    <!-- DEVICE LIST -->
    <div class="card">
        <h2>Devices</h2>

        <button onclick="loadDevices()">
            Refresh Devices
        </button>

        <div id="deviceList" class="device-list">
            No devices loaded.
        </div>
    </div>

    <!-- DEVICE ACTIONS -->
    <div class="card">
        <h2>Device Actions</h2>

        <input
            type="text"
            id="actionDeviceId"
            placeholder="Device ID"
        >

        <input
            type="text"
            id="deviceName"
            placeholder="New device name"
        >

        <button onclick="renameDevice()">
            Rename Device
        </button>

        <button class="success" onclick="heartbeat()">
            Send Heartbeat
        </button>

        <button class="secondary" onclick="getDevice()">
            Get Device
        </button>
    </div>

    <!-- MEDIA UPLOAD -->
    <div class="card">
        <h2>Upload Media</h2>

        <input
            type="file"
            id="mediaFile"
            accept="image/*,video/*"
        >

        <button onclick="uploadMedia()">
            Upload Media
        </button>

        <p class="small">
            Images and videos are supported.
        </p>
    </div>

    <!-- MEDIA LIST -->
    <div class="card">
        <h2>Media Library</h2>

        <button onclick="loadMedia()">
            Refresh Media
        </button>

        <div id="mediaList" class="media-list">
            No media loaded.
        </div>
    </div>

    <!-- MEDIA ASSIGNMENT -->
    <div class="card">
        <h2>Assign Media</h2>

        <input
            type="text"
            id="assignDeviceId"
            placeholder="Device ID"
        >

        <input
            type="number"
            id="assignMediaId"
            placeholder="Media ID"
        >

        <button onclick="assignMedia()">
            Assign Media
        </button>

        <button class="secondary" onclick="getDeviceMedia()">
            Show Device Media
        </button>
    </div>

    <!-- REMOVE MEDIA -->
    <div class="card">
        <h2>Remove Assigned Media</h2>

        <input
            type="text"
            id="removeDeviceId"
            placeholder="Device ID"
        >

        <input
            type="number"
            id="removeMediaId"

</div>

<script>

const API = "http://localhost:8080";

const result = document.getElementById("result");

function showResult(data) {
    if (typeof data === "string") {
        result.textContent = data;
    } else {
        result.textContent = JSON.stringify(data, null, 2);
    }
}

async function request(url, options = {}) {

    try {

        const response = await fetch(API + url, options);

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = text;
        }

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}: ${
                    typeof data === "string"
                        ? data
                        : JSON.stringify(data)
                }`
            );
        }

        return data;

    } catch (error) {

        showResult("ERROR:\n" + error.message);

        throw error;
    }
}


/* =========================
   DEVICES
========================= */

async function registerDevice() {

    const deviceId =
        document.getElementById("deviceId").value.trim();

    if (!deviceId) {
        alert("Enter a device ID.");
        return;
    }

    try {

        const data = await request(
            "/api/devices/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    device_id: deviceId
                })
            }
        );

        showResult(data);

        loadDevices();

    } catch {}
}


async function loadDevices() {

    try {

        const devices =
            await request("/api/devices");

        showResult(devices);

        const container =
            document.getElementById("deviceList");

        if (!devices.length) {

            container.innerHTML =
                "<p>No devices found.</p>";

            return;
        }

        container.innerHTML = "";

        devices.forEach(device => {

            const div =
                document.createElement("div");

            div.className = "item";

            const statusClass =
                device.status === "online"
                    ? "status-online"
                    : "status-offline";

            div.innerHTML = `
                <strong>${escapeHtml(device.name)}</strong><br>
                ID: ${escapeHtml(device.id)}<br>
                Status:
                <span class="${statusClass}">
                    ${escapeHtml(device.status)}
                </span><br>
                Last Seen: ${device.last_seen}
            `;

            container.appendChild(div);
        });

    } catch {}
}


async function getDevice() {

    const id =
        document.getElementById("actionDeviceId")
            .value.trim();

    if (!id) {
        alert("Enter device ID.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(id)}`
            );

        showResult(data);

    } catch {}
}


async function renameDevice() {

    const id =
        document.getElementById("actionDeviceId")
            .value.trim();

    const name =
        document.getElementById("deviceName")
            .value.trim();

    if (!id || !name) {
        alert("Enter device ID and new name.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(id)}/name`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name
                    })
                }
            );

        showResult(data);

        loadDevices();

    } catch {}
}


async function heartbeat() {

    const id =
        document.getElementById("actionDeviceId")
            .value.trim();

    if (!id) {
        alert("Enter device ID.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(id)}/heartbeat`,
                {
                    method: "POST"
                }
            );

        showResult(data);

        loadDevices();

    } catch {}
}


/* =========================
   MEDIA
========================= */

async function uploadMedia() {

    const input =
        document.getElementById("mediaFile");

    if (!input.files.length) {
        alert("Select a file first.");
        return;
    }

    const file = input.files[0];

    try {

        /*
         * Your working backend route:
         *
         * POST /api/media/upload/{filename}
         *
         * It expects the raw file body.
         */

        const data =
            await request(
                `/api/media/upload/${encodeURIComponent(file.name)}`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            file.type ||
                            "application/octet-stream"
                    },
                    body: file
                }
            );

        showResult(data);

        loadMedia();

    } catch {}
}


async function loadMedia() {

    try {

        const media =
            await request("/api/media");

        showResult(media);

        const container =
            document.getElementById("mediaList");

        if (!media.length) {

            container.innerHTML =
                "<p>No media found.</p>";

            return;
        }

        container.innerHTML = "";

        media.forEach(item => {

            const div =
                document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <strong>
                    ${escapeHtml(item.original_name)}
                </strong><br>

                ID: ${item.id}<br>
                Type: ${escapeHtml(item.type)}<br>

                <button
                    onclick="previewMedia(${item.id})"
                >
                    Preview
                </button>

                <div id="preview-${item.id}"></div>
            `;

            container.appendChild(div);
        });

    } catch {}
}


function previewMedia(id) {

    const container =
        document.getElementById(`preview-${id}`);

    container.innerHTML = `
        <img
            class="preview"
            src="${API}/api/media/${id}/file"
            alt="Media preview"
        >
    `;
}


/* =========================
   DEVICE MEDIA
========================= */

async function assignMedia() {

    const deviceId =
        document.getElementById("assignDeviceId")
            .value.trim();

    const mediaId =
        document.getElementById("assignMediaId")
            .value.trim();

    if (!deviceId || !mediaId) {
        alert("Enter device ID and media ID.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(deviceId)}/media`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        media_id: Number(mediaId)
                    })
                }
            );

        showResult(data);

    } catch {}
}


async function getDeviceMedia() {

    const deviceId =
        document.getElementById("assignDeviceId")
            .value.trim();

    if (!deviceId) {
        alert("Enter device ID.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(deviceId)}/media`
            );

        showResult(data);

    } catch {}
}


async function removeMedia() {

    const deviceId =
        document.getElementById("removeDeviceId")
            .value.trim();

    const mediaId =
        document.getElementById("removeMediaId")
            .value.trim();

    if (!deviceId || !mediaId) {
        alert("Enter device ID and media ID.");
        return;
    }

    try {

        const data =
            await request(
                `/api/devices/${encodeURIComponent(deviceId)}/media/${encodeURIComponent(mediaId)}`,
                {
                    method: "DELETE"
                }
            );

        showResult(data);

    } catch {}
}


/* =========================
   SECURITY / HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* Load initial data */

loadDevices();
loadMedia();

</script>

</body>
